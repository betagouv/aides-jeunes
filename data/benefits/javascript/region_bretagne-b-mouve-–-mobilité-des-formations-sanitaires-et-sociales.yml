label: b-Mouve – Mobilité des formations sanitaires et sociales
institution: region_bretagne
description: La subvention B-Mouve vise à permettre aux élèves et étudiants et
  étudiantes des formations sanitaires et sociales de la Région Bretagne de
  réaliser des stages ou des séjours d'études en Europe. Le montant de l’aide
  dépend du profil des bénéficiaires.
conditions:
  - La mobilité doit s’inscrire dans le cadre du cursus de formation ou dans
    l’année qui suit l’obtention du diplôme.
