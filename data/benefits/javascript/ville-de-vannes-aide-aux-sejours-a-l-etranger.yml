label: Aide aux séjours à l'étranger
institution: ville-de-vannes
description: >-
  La Ville de Vannes soutient les étudiants post-bac qui partent étudier ou
  faire un stage à l'étranger. L'aide est accordée une fois par an, sans
  condition de ressources. Son montant dépend de la durée du séjour (minimum 3
  semaines) et de la destination. Contact: BIJ de Vannes (02 97 01 61 00,
  bij@mairie-vannes.fr).
conditions:
  - Être âgé de moins de 25 ans
  - Séjour de 3 semaines au minimum
conditions_generales:
