label: aides à l'hébergement et la restauration des lycéens ou lycéennes
institution: region_bourgogne_franche_comte
description: Cette aide vous permet d'obtenir une déduction sur vos frais
  d’hébergement et/ou de restauration facturés par les établissements.
conditions_generales:
  - type: regions
    values:
      - "27"
profils:
  - type: lyceen
    conditions:
      - type: boursier
link: https://www.bourgognefranchecomte.fr/node/322
instructions: https://www.bourgognefranchecomte.fr/node/322
prefix: les
type: bool
unit: €
periodicite: autre
conditions:
  - Être inscrit dans un établissement public ou privé sous contrat
  - Être lycéen (3e, 4e, 3e découverte professionnelle ou 3e agricole)
  - Être demi‑pensionnaire, interne ou interne‑externé
  - Être bénéficiaire d’une bourse ou, le cas échéant, ne pas être bénéficiaire
    d’une bourse (selon le dispositif)
